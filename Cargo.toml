[package]
name = "live-paper"
version = "0.3.0"
edition = "2024"
description = "A Wayland video wallpaper engine"
repository = "https://github.com/sinder38/live-paper-rs"
homepage = "https://github.com/sinder38/live-paper-rs"
license = "MIT"

[lib]
name = "live_paper"
path = "src/lib.rs"

[[bin]]
name = "live-paper"
path = "src/bin/live-paper.rs"

[features]
default = ["auto-restart"]
# Replace the renderer process on a schedule or above a memory limit, to work
# around libmpv never giving back everything it allocates. See src/daemon/restart.rs
auto-restart = []

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
log = {version = "0.4"}
env_logger = {version = "0.11.11"}
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libmpv2 = "6.0.0"
smithay-client-toolkit = "0.20.0" # TODO: migrate to 21 later
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
zbus = "5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
