name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      NAME: live-paper-linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2

      # live-paper links against system libmpv, EGL and wayland at build time
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            pkg-config

      - name: Build
        run: cargo build --release --target ${{ env.TARGET }}

      - name: Package
        run: |
          cp target/${{ env.TARGET }}/release/live-paper ${{ env.NAME }}
          tar czf ${{ env.NAME }}.tar.gz ${{ env.NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tar.gz"

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            pkg-config

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur-source:
    needs: release
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" aur/live-paper/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" aur/live-paper/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: live-paper
          pkgbuild: aur/live-paper/PKGBUILD
          updpkgsums: true
          commit_username: sinder
          commit_email: smirnov.sinder@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"

  aur-bin:
    needs: release
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" aur/live-paper-bin/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" aur/live-paper-bin/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: live-paper-bin
          pkgbuild: aur/live-paper-bin/PKGBUILD
          updpkgsums: true
          commit_username: sinder
          commit_email: smirnov.sinder@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
