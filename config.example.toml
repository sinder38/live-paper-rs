# Example live-paper config

# Choice of redering backend
# mpv/player - render video (yes, you want this)
# pattern - render one of the test patterns
backend = "mpv"

[player]
# Path to the video file, can be overwritten using CLI args
path = "/path/to/video.mp4"
# mpv `speed` property, e.g. 1.5 = 50% faster
speed = 1.0
# wallpapers are usually silent
mute = true
# "auto" | "no" | specific mpv hwdec name
hwdec = "auto"
# crops the video to fill the screen (no black bars)
fill = true

[player.mpv_options]
# For the full please refer to: https://mpv.io/manual/master/#options
# Free-form passthrough to mpv.set_property. Anything not modeled by the
# typed fields above can go here.

# A few options worth knowing about:

# "video-rotate" = "0"       # rotate output in 90deg steps
# "deinterlace" = "no"       # turn on if the source is interlaced
# "saturation" = "0"         # -100..100, video-eq color adjustments
# "contrast" = "0"
# "brightness" = "0"
# "gamma" = "0"
# "interpolation" = "no"     # yes + tscale=oversample smooths motion, costs GPU
# "tscale" = "oversample"
# "video-sync" = "audio"     # frame timing/drop behavior, matters more once speed != 1.0
# "start" = "0"              # seek offset before playback begins, e.g. "30" or "00:00:30"
# "ao" = "null"              # hard-disable audio output entirely (alternative to mute)

[layer]
# "background" | "bottom" | "top" | "overlay"
layer = "background"
exclusive_zone = -1

[pause]
# Pause when an application is fullscreen, individually for each workspace
on_fullscreen = true
# Pause when an application is maximized, individually for each workspace
on_maximized = true
# Pause when gamemode is on
on_gamemode = true
# Pause when screen is off
on_screen_off = true


[restart]
# Only read by `live-paper-daemon`, and only in a build with the `auto-restart`
# feature (on by default).
#
# libmpv never gives back some of what it allocates, so the renderer process is
# replaced now and then. The replacement draws its first frame before the old one
# goes away, so this is not visible.

# Replace it this often: "90s", "30m", "6h", "2d". Unset means never.
# every = "6h"
# ...or once it passes this much memory, in MiB. Unset means never.
# above_memory_mb = 2000


[debug]
enabled = false
